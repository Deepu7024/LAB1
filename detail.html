<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background-color: #34495e;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .back-btn:hover {
            background-color: #2c3e50;
        }
        .detail-card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .detail-card h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .detail-card p {
            margin-bottom: 12px;
        }
        .price {
            font-weight: bold;
            color: #27ae60;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← Back to Home</a>
    
    <div class="detail-card">
        <h2 id="book-title">Loading...</h2>
        <p><strong>Author:</strong> <span id="book-author">-</span></p>
        <p><strong>Genre:</strong> <span id="book-genre">-</span></p>
        <p><strong>Price:</strong> <span id="book-price" class="price">-</span></p>
        <p><strong>Description:</strong></p>
        <p id="book-desc">-</p>
    </div>
</div>

<script>
    // Database of books matching the IDs passed from the home page
    const booksData = {
        1: {
            title: "The Great Gatsby",
            author: "F. Scott Fitzgerald",
            genre: "Classic Fiction",
            price: "$10.99",
            description: "The story of the fabulously wealthy Jay Gatsby and his love for the beautiful Daisy Buchanan, of lavish parties on Long Island at a time when The New York Times noted 'gin was the national drink and sex the national obsession.'"
        },
        2: {
            title: "To Kill a Mockingbird",
            author: "Harper Lee",
            genre: "Legal Drama",
            price: "$12.50",
            description: "A novel of a childhood in a sleepy southern town and the crisis of conscience that rocked it. Compassionate, dramatic, and deeply moving, To Kill a Mockingbird takes readers to the roots of human behavior - to innocence and experience, kindness and cruelty."
        },
        3: {
            title: "1984",
            author: "George Orwell",
            genre: "Dystopian Sci-Fi",
            price: "$9.99",
            description: "Winston Smith is a man tasked with rewriting history in an Orwellian state where the Party monitors every detail of human life, tracking down 'thoughtcrime' and demanding absolute submission."
        },
        4: {
            title: "Pride and Prejudice",
            author: "Jane Austen",
            genre: "Romance",
            price: "$8.99",
            description: "The story charts the turbulent relationship between Elizabeth Bennet, the daughter of a country gentleman, and Fitzwilliam Darcy, a rich aristocratic landowner."
        }
    };

    // Extract the 'id' parameter from the URL query string
    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('id');

    // Retrieve the matching book and update the page elements
    const book = booksData[bookId];
    if (book) {
        document.getElementById('book-title').innerText = book.title;
        document.getElementById('book-author').innerText = book.author;
        document.getElementById('book-genre').innerText = book.genre;
        document.getElementById('book-price').innerText = book.price;
        document.getElementById('book-desc').innerText = book.description;
    } else {
        document.getElementById('book-title').innerText = "Book Not Found";
        document.getElementById('book-desc').innerText = "Sorry, the book you are looking for does not exist.";
    }
</script>

</body>
</html>
